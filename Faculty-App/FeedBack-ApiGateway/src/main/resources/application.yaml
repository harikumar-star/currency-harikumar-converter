server:
  port: 1111

spring:
  application:
    name: FeedBack-ApiGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: student-service
              uri: http://localhost:5555
              predicates:
                - Path=/students/**

            - id: faculty-service
              uri: http://localhost:5555
              predicates:
                - Path=/faculty/**